name: Build & Release World Clock

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Portable Single-File Executable
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore src/WorldClock.csproj

      - name: Build & Publish Release Binary
        run: |
          dotnet publish src/WorldClock.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldClock-Windows-x64
          path: dist/WorldClock.exe
          if-no-files-found: error

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WorldClock.exe
          generate_release_notes: true
          draft: false
          prerelease: false
